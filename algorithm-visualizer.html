<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithm Visualizer | CSIT 212 Final Project</title>
    <meta name="description" content="Interactive algorithm visualizer with Java code stepping.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="visualizer.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">CSIT 212 Final Project</a>
        <ul class="nav-links">
            <li><a href="index.html">Binary Calculator</a></li>
            <li><a href="boolean-logic.html">Boolean Logic</a></li>
            <li><a href="algorithm-visualizer.html" class="active">Algorithms</a></li>
            <li><a href="circuit-builder.html">Circuit Builder</a></li>
            <li class="dropdown">
                <a href="javascript:void(0)" class="dropbtn">Languages ▼</a>
                <div class="dropdown-content">
                    <a href="html-summary.html">HTML</a>
                    <a href="css-summary.html">CSS</a>
                    <a href="js-summary.html">JavaScript</a>
                    <a href="python-summary.html">Python</a>
                </div>
            </li>
        </ul>
    </nav>

    <main class="container">
        <header class="header">
            <h1>Algorithm Visualizer</h1>
            <p>Step through algorithms from the CSIT 212 Final Exam Review in Java</p>
        </header>

        <section id="algorithmDetails" class="card" style="margin-bottom: 2.5rem; padding: 2rem;">
            <!-- Injected by JS -->
        </section>

        <section class="visualizer-container">
            <div class="visualization-panel">
                <div class="controls">
                    <select id="algoSelect">
                        <option value="merge">Merge Sort</option>
                        <option value="quick">Quick Sort</option>
                        <option value="insertion">Insertion Sort</option>
                        <option value="heap">Heap Sort</option>
                        <option value="counting">Counting Sort</option>
                    </select>
                    <button id="btnReset">Reset Array</button>
                    <button id="btnPrev" disabled>&larr; Prev Step</button>
                    <button id="btnNext">Next Step &rarr;</button>
                    <button id="btnPlay">Play</button>
                </div>
                <div id="arrayContainer" class="array-container">
                    <!-- Bars generated by JS -->
                </div>
            </div>

            <div class="code-panel">
                <div id="codeContainer">
                    <!-- Java Code injected by JS -->
                </div>
            </div>
        </section>
    </main>

    <script src="visualizer.js"></script>
</body>
</html>
