<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSIT 212 Final Project</title>
    <meta name="description" content="A simple and minimalistic binary conversion calculator.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">CSIT 212 Final Project</div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Calculator</a></li>
            <li><a href="ai-prompts.html">AI Prompts</a></li>
        </ul>
    </nav>

    <main class="container">
        <header class="header">
            <h1>Binary Converter</h1>
            <p>Convert numbers between Base 2 and Decimal</p>
        </header>

        <div class="main-content">
            <section class="calculator-card card">
                <div class="input-group">
                    <label for="binaryInput">Base 2 (Binary)</label>
                    <input type="text" id="binaryInput" placeholder="e.g. 1010" autocomplete="off">
                    <button id="btnToDecimal" class="btn">Convert to Decimal &darr;</button>
                </div>

                <div class="divider"></div>

                <div class="input-group">
                    <label for="decimalInput">Base 10 (Decimal)</label>
                    <input type="number" id="decimalInput" placeholder="e.g. 10" autocomplete="off">
                    <button id="btnToBinary" class="btn">Convert to Binary &uarr;</button>
                </div>
                
                <div id="errorMessage" class="error-msg" hidden>Invalid input</div>
            </section>

            <aside class="reference-table card">
                <h3>Reference Guide</h3>
                <table>
                    <thead>
                        <tr><th>Decimal</th><th>Binary</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>0</td><td>0000</td></tr>
                        <tr><td>1</td><td>0001</td></tr>
                        <tr><td>2</td><td>0010</td></tr>
                        <tr><td>3</td><td>0011</td></tr>
                        <tr><td>4</td><td>0100</td></tr>
                        <tr><td>5</td><td>0101</td></tr>
                        <tr><td>6</td><td>0110</td></tr>
                        <tr><td>7</td><td>0111</td></tr>
                        <tr><td>8</td><td>1000</td></tr>
                        <tr><td>9</td><td>1001</td></tr>
                        <tr><td>10</td><td>1010</td></tr>
                        <tr><td>11</td><td>1011</td></tr>
                        <tr><td>12</td><td>1100</td></tr>
                        <tr><td>13</td><td>1101</td></tr>
                        <tr><td>14</td><td>1110</td></tr>
                        <tr><td>15</td><td>1111</td></tr>
                    </tbody>
                </table>
            </aside>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
